name: K6 Load Test

on:
  # Esto te permite ejecutarlo manually
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona tu repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. ¡AÑADE ESTE PASO NUEVO!
      # Instala la herramienta k6 en la máquina virtual
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          # Usa la última versión de k6
          k6-version: latest

      # 3. Ejecuta la prueba de k6
      - name: Run k6 cloud test
        uses: grafana/run-k6-action@v1
        with:
          # ¡AQUÍ ESTÁ EL CAMBIO!
          # Se usa 'path:' en lugar de 'script-file:'
          path: "k6-scripts/Practica-ProyectoV2.js"
          
          # (Ya no necesitas 'cloud: true'. La acción lo detecta
          # automáticamente gracias a la variable de entorno)

        env:
          # El 'env:' va dentro del paso 'Run k6 cloud test'
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_API_TOKEN }}