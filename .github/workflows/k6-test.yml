name: K6 Load Test

on:
  # Esto te permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona tu repositorio para que la acción tenga acceso a tu script
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Ejecuta la acción oficial de K6
      - name: Run k6 cloud test
        uses: grafana/k6-action@v0
        with:
          # ¡IMPORTANTE! 
          # Cambia esto a la ruta y nombre exacto de tu script de K6
          script-file: "k6-scripts/Practica-ProyectoV2.js"

          # Le dice a K6 que envíe los datos a la nube (Grafana Cloud)
          cloud: true

        env:
          # Usa el secret que acabas de crear
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_API_TOKEN }}